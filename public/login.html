<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — PDRS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/animations.css" />
  </head>
  <body>
    <nav class="nav">
      <a class="nav__brand" href="/">PDRS</a>
      <div class="nav__links">
        <a href="/register.html">Register</a>
      </div>
    </nav>

    <main class="container container--narrow">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/">Home</a><span class="breadcrumb__sep">›</span><span>Login</span>
      </nav>

      <section class="card anim-fade-in">
        <h2 class="card__title">Login</h2>
        <p class="muted">Sign in with your student or faculty account.</p>

        <form id="login-form" class="form" autocomplete="on" novalidate data-validate>
          <div class="form__row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   placeholder="you@example.com" autofocus />
          </div>
          <div class="form__row">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6"
                   autocomplete="current-password" placeholder="••••••••" />
          </div>
          <div class="form__row form__row--inline">
            <label class="checkbox-row">
              <input type="checkbox" id="remember" name="remember" />
              <span>Remember me</span>
            </label>
            <a href="#" id="forgot-link" class="muted" style="font-size:13px;">Forgot password?</a>
          </div>
          <p id="form-error" class="status status--err hidden" role="alert"></p>
          <button type="submit" id="login-submit" class="btn btn--primary">Sign in</button>
          <p class="muted">Don't have an account? <a href="/register.html">Register</a>.</p>
        </form>
      </section>

      <section class="card anim-slide-up">
        <h2 class="card__title">Demo accounts</h2>
        <p class="muted">
          <code>demo_student@pdrs.com</code> / <code>demo1234</code><br />
          <code>demo_faculty@pdrs.com</code> / <code>demo1234</code>
        </p>
      </section>
    </main>

    <div class="toast-host" id="toast-host"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
      (function () {
        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('form-error');
        const submitBtn = document.getElementById('login-submit');
        const emailEl = document.getElementById('email');
        const forgot = document.getElementById('forgot-link');

        function showError(msg) {
          errorEl.textContent = msg;
          errorEl.classList.remove('hidden');
        }
        function clearError() {
          errorEl.textContent = '';
          errorEl.classList.add('hidden');
        }

        // If already signed in, send to dashboard
        if (pdrs.auth.isAuthenticated()) {
          const user = pdrs.auth.getUser();
          window.location.replace(pdrs.auth.dashboardFor(user && user.role));
          return;
        }

        // Restore remembered email
        try {
          const last = window.localStorage.getItem('pdrs.lastEmail');
          if (last) {
            emailEl.value = last;
            document.getElementById('remember').checked = true;
            document.getElementById('password').focus();
          }
        } catch (_e) { /* ignore */ }

        forgot.addEventListener('click', (e) => {
          e.preventDefault();
          window.pdrs.toast.info('Password reset is coming in a later phase.');
        });

        form.addEventListener('submit', async function (ev) {
          ev.preventDefault();
          clearError();

          const email = form.email.value.trim();
          const password = form.password.value;
          if (!email || !password) {
            showError('Please enter both email and password.');
            return;
          }

          if (document.getElementById('remember').checked) {
            window.localStorage.setItem('pdrs.lastEmail', email);
          } else {
            window.localStorage.removeItem('pdrs.lastEmail');
          }

          window.pdrs.ui.setLoading(submitBtn, true, 'Signing in…');
          try {
            const res = await pdrs.api.post('/api/auth/login', { email, password });
            pdrs.auth.saveToken(res.token, res.user);
            pdrs.toast.ok('Welcome back, ' + (res.user.name || res.user.email));
            window.location.href = pdrs.auth.dashboardFor(res.user.role);
          } catch (err) {
            const msg = (err && err.body && err.body.error) || err.message || 'Login failed';
            showError(msg);
            form.classList.add('shake');
            setTimeout(() => form.classList.remove('shake'), 450);
          } finally {
            window.pdrs.ui.setLoading(submitBtn, false);
          }
        });
      })();
    </script>
  </body>
</html>
