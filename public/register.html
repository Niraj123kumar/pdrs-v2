<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register — PDRS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <style>
      .role-toggle {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 4px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
      }
      .role-toggle input { position: absolute; opacity: 0; pointer-events: none; }
      .role-toggle label {
        text-align: center;
        padding: 10px 12px;
        border-radius: calc(var(--radius-sm) - 2px);
        cursor: pointer;
        color: var(--muted);
        font-weight: 600;
        transition: background 120ms ease, color 120ms ease;
        user-select: none;
      }
      .role-toggle input:checked + label {
        background: var(--accent);
        color: #0b1020;
      }
      .role-toggle input:focus-visible + label {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a class="nav__brand" href="/">PDRS</a>
      <div class="nav__links">
        <a href="/login.html">Login</a>
      </div>
    </nav>

    <main class="container container--narrow">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/">Home</a><span class="breadcrumb__sep">›</span><span>Register</span>
      </nav>

      <section class="card anim-fade-in">
        <h2 class="card__title">Create account</h2>
        <p class="muted">Join PDRS as a student or faculty member.</p>

        <form id="register-form" class="form" autocomplete="on" novalidate data-validate>
          <div class="form__row">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" required autocomplete="name"
                   placeholder="Your name" autofocus maxlength="120" />
          </div>
          <div class="form__row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   placeholder="you@example.com" maxlength="254" />
          </div>
          <div class="form__row">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8"
                   autocomplete="new-password" placeholder="At least 8 characters" maxlength="128" />
          </div>
          <div class="form__row">
            <label>Role</label>
            <div class="role-toggle" role="radiogroup" aria-label="Account role">
              <input type="radio" id="role-student" name="role" value="student" checked />
              <label for="role-student">Student</label>
              <input type="radio" id="role-faculty" name="role" value="faculty" />
              <label for="role-faculty">Faculty</label>
            </div>
          </div>
          <p id="form-error" class="status status--err hidden" role="alert"></p>
          <button type="submit" id="register-submit" class="btn btn--primary">Create account</button>
          <p class="muted">Already have an account? <a href="/login.html">Login</a>.</p>
        </form>
      </section>
    </main>

    <div class="toast-host" id="toast-host"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
      (function () {
        const form = document.getElementById('register-form');
        const errorEl = document.getElementById('form-error');
        const submitBtn = document.getElementById('register-submit');
        const pwInput = document.getElementById('password');

        // Attach strength meter to password field
        if (window.pdrs && window.pdrs.ui && window.pdrs.ui.attachStrengthMeter) {
          window.pdrs.ui.attachStrengthMeter(pwInput);
        }

        // If already signed in, redirect to dashboard
        if (pdrs.auth.isAuthenticated()) {
          const user = pdrs.auth.getUser();
          window.location.replace(pdrs.auth.dashboardFor(user && user.role));
          return;
        }

        function showError(msg) {
          errorEl.textContent = msg;
          errorEl.classList.remove('hidden');
        }
        function clearError() {
          errorEl.textContent = '';
          errorEl.classList.add('hidden');
        }

        form.addEventListener('submit', async function (ev) {
          ev.preventDefault();
          clearError();

          const name = form.name.value.trim();
          const email = form.email.value.trim();
          const password = form.password.value;
          const roleInput = form.querySelector('input[name="role"]:checked');
          const role = roleInput ? roleInput.value : '';

          if (!name || !email || !password || !role) {
            showError('Please fill out every field.');
            return;
          }
          if (password.length < 8) {
            showError('Password must be at least 8 characters.');
            return;
          }

          window.pdrs.ui.setLoading(submitBtn, true, 'Creating account…');
          try {
            const res = await pdrs.api.post('/api/auth/register', { name, email, password, role });
            pdrs.auth.saveToken(res.token, res.user);
            pdrs.toast.ok('Account created. Welcome, ' + res.user.name + '!');
            window.location.href = pdrs.auth.dashboardFor(res.user.role);
          } catch (err) {
            let msg = (err && err.body && err.body.error) || err.message || 'Registration failed';
            if (err && err.body && Array.isArray(err.body.details) && err.body.details.length) {
              msg = err.body.details.map((d) => d.msg || d.message).filter(Boolean).join('; ') || msg;
            }
            showError(msg);
            form.classList.add('shake');
            setTimeout(() => form.classList.remove('shake'), 450);
          } finally {
            window.pdrs.ui.setLoading(submitBtn, false);
          }
        });
      })();
    </script>
  </body>
</html>
