<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session Results — PDRS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/animations.css" />
  </head>
  <body>
    <nav class="nav">
      <a class="nav__brand" href="/">PDRS</a>
      <div class="nav__links">
        <a href="/student.html">Dashboard</a>
        <a href="/history.html">History</a>
      </div>
    </nav>

    <main class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/student.html">Dashboard</a>
        <span class="breadcrumb__sep">›</span>
        <a href="/history.html">History</a>
        <span class="breadcrumb__sep">›</span>
        <span>Results</span>
      </nav>

      <header class="hero anim-fade-in">
        <h1>Session Results</h1>
        <p class="tagline">Per-question scores and overall feedback.</p>
      </header>

      <section class="card anim-slide-up">
        <h2 class="card__title">Overall score</h2>
        <p id="overall-score" class="muted">Results view wires up in a later phase.</p>
      </section>

      <section class="card anim-slide-up">
        <h2 class="card__title">Score breakdown</h2>
        <canvas id="score-chart" width="720" height="240" aria-label="Score breakdown chart"></canvas>
      </section>

      <section class="card anim-slide-up">
        <h2 class="card__title">Per-question feedback</h2>
        <div id="question-breakdown" class="stack"></div>
      </section>
    </main>

    <div class="toast-host" id="toast-host"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/charts.js"></script>
    <script>
      (function () {
        const ui = window.pdrs.ui;
        const host = document.getElementById('question-breakdown');
        host.appendChild(ui.skeletonLines(4));
        setTimeout(() => {
          host.innerHTML = '';
          host.appendChild(
            ui.emptyState({
              icon: '📊',
              title: 'No results yet',
              message: 'Complete a rehearsal session to see scored feedback here.',
              ctaText: 'Back to dashboard',
              ctaHref: '/student.html',
            })
          );
        }, 350);
      })();
    </script>
  </body>
</html>
