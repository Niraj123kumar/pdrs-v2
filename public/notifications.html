<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notifications — PDRS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/animations.css" />
  </head>
  <body>
    <nav class="nav">
      <a class="nav__brand" href="/">PDRS</a>
      <div class="nav__links">
        <a href="/student.html">Dashboard</a>
        <a href="/history.html">History</a>
      </div>
    </nav>

    <main class="container">
      <header class="hero anim-fade-in">
        <h1>Notifications</h1>
        <p class="tagline">Requests, panel invites, and session updates.</p>
      </header>

      <section class="card anim-slide-up">
        <div class="row row--between">
          <h2 class="card__title">Recent</h2>
          <button class="btn btn--ghost" id="mark-all-read" disabled>Mark all read</button>
        </div>
        <div id="notification-list" class="stack">
          <p class="muted">Notification list wires up in a later phase.</p>
        </div>
      </section>
    </main>

    <div class="toast-host" id="toast-host"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/websocket.js"></script>
  </body>
</html>
