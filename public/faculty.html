<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Faculty Dashboard — PDRS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/animations.css" />
  </head>
  <body>
    <nav class="nav">
      <a class="nav__brand" href="/">PDRS</a>
      <div class="nav__links">
        <a href="/faculty.html">Dashboard</a>
        <a href="/panel.html">Panel</a>
        <a href="/notifications.html">Notifications</a>
        <a href="/login.html">Logout</a>
      </div>
    </nav>

    <main class="container">
      <header class="hero anim-fade-in">
        <h1>Faculty Dashboard</h1>
        <p class="tagline">Review student submissions and run panel sessions.</p>
      </header>

      <section class="card anim-slide-up">
        <h2 class="card__title">Pending requests</h2>
        <div id="requests-host"></div>
      </section>

      <section class="card anim-slide-up">
        <h2 class="card__title">Upcoming panels</h2>
        <div id="panels-host"></div>
      </section>
    </main>

    <div class="toast-host" id="toast-host"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/websocket.js"></script>
    <script>
      (function () {
        const ui = window.pdrs.ui;
        const requestsHost = document.getElementById('requests-host');
        const panelsHost = document.getElementById('panels-host');

        requestsHost.appendChild(ui.skeletonLines(3));
        panelsHost.appendChild(ui.skeletonLines(2));

        setTimeout(() => {
          requestsHost.innerHTML = '';
          requestsHost.appendChild(
            ui.emptyState({
              icon: '📥',
              title: 'No pending requests',
              message: 'Student panel requests will appear here as they come in.',
            })
          );
          panelsHost.innerHTML = '';
          panelsHost.appendChild(
            ui.emptyState({
              icon: '🎙️',
              title: 'No upcoming panels',
              message: 'Schedule a panel from a pending request to see it here.',
              ctaText: 'Open Panel page',
              ctaHref: '/panel.html',
            })
          );
        }, 350);
      })();
    </script>
  </body>
</html>
