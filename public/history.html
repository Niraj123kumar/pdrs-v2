<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History — PDRS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/animations.css" />
  </head>
  <body>
    <nav class="nav">
      <a class="nav__brand" href="/">PDRS</a>
      <div class="nav__links">
        <a href="/student.html">Dashboard</a>
        <a href="/notifications.html">Notifications</a>
      </div>
    </nav>

    <main class="container">
      <header class="hero anim-fade-in">
        <h1>Session History</h1>
        <p class="tagline">All your past rehearsal and panel sessions.</p>
      </header>

      <section class="card anim-slide-up">
        <h2 class="card__title">Sessions</h2>
        <table class="table" id="history-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Project</th>
              <th>Status</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="4" class="muted">History view wires up in a later phase.</td></tr>
          </tbody>
        </table>
      </section>
    </main>

    <div class="toast-host" id="toast-host"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/animations.js"></script>
  </body>
</html>
