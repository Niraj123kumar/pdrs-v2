services:
  - type: web
    name: pdrs
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: pdrs-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: DB_PATH
        value: /opt/render/project/src/data/pdrs.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: ""
      - key: BCRYPT_ROUNDS
        value: "10"
